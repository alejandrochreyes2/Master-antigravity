<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas Seguras</title>
    <meta name="description" content="Generador de contraseñas aleatorias seguras, personalizables con números, símbolos, mayúsculas y minúsculas.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Estilos -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Generador de Contraseñas</h1>
        </header>

        <!-- Display de la contraseña -->
        <section class="display-container" aria-label="Resultado de contraseña">
            <div class="password-display placeholder" id="passwordDisplay">P4$5W0rD!</div>
            
            <div class="display-actions">
                <button type="button" class="action-btn" id="toggleBtn" aria-label="Mostrar u ocultar contraseña" title="Mostrar/Ocultar">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon icon-eye-off" id="iconEye">
                        <!-- Default eye-off path -->
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
                <button type="button" class="action-btn" id="copyBtn" aria-label="Copiar contraseña" title="Copiar al portapapeles">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon icon-copy">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
            <!-- Feedback de copia insertado dinámicamente en main.js -->
        </section>

        <!-- Indicador de Fuerza -->
        <section class="strength-container" aria-label="Nivel de seguridad">
            <div class="strength-header">
                <span>Fuerza</span>
                <span id="strengthText" class="strength-text text-muted">Aún no generada</span>
            </div>
            <div class="strength-bars" id="strengthBars">
                <div class="strength-bar" id="bar1"></div>
                <div class="strength-bar" id="bar2"></div>
                <div class="strength-bar" id="bar3"></div>
                <div class="strength-bar" id="bar4"></div>
            </div>
        </section>

        <!-- Controles -->
        <section class="controls-container">
            <div class="control-group length-group">
                <div class="length-header">
                    <label for="lengthSlider">Longitud de caracteres</label>
                    <span id="lengthValue" class="length-value">16</span>
                </div>
                <!-- El ID debe coincidir en las pruebas -->
                <input type="range" id="lengthSlider" min="8" max="32" value="16" step="1" aria-valuemin="8" aria-valuemax="32" aria-valuenow="16">
            </div>

            <div class="options-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="uppercaseCb" checked>
                    <span class="checkmark"></span>
                    <span class="label-text">Incluir Letras Mayúsculas (A-Z)</span>
                </label>
                
                <label class="checkbox-container">
                    <input type="checkbox" id="lowercaseCb" checked>
                    <span class="checkmark"></span>
                    <span class="label-text">Incluir Letras Minúsculas (a-z)</span>
                </label>
                
                <label class="checkbox-container">
                    <input type="checkbox" id="numbersCb" checked>
                    <span class="checkmark"></span>
                    <span class="label-text">Incluir Números (0-9)</span>
                </label>
                
                <label class="checkbox-container">
                    <input type="checkbox" id="symbolsCb">
                    <span class="checkmark"></span>
                    <span class="label-text">Incluir Símbolos (!@#$...)</span>
                </label>
            </div>
        </section>

        <button type="button" class="generate-btn" id="generateBtn">
            <span>Generar Contraseña</span>
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path>
                <path d="M12 5l7 7-7 7"></path>
            </svg>
        </button>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
